[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mamori"
version = "0.32.0"
description = "Local-first privacy layer for generative AI. Detect and pseudonymize secrets before they reach an external LLM, and restore them locally afterwards."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nananananana" }]
keywords = ["privacy", "pii", "llm", "anonymization", "pseudonymization", "security", "japanese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    # Only to check that what mamori emits validates against the schema it
    # ships. Not a runtime dependency: the promise of zero of those holds.
    "jsonschema>=4.0",
    "ruff>=0.6",
    "mypy>=1.10",
    # Exercised by the encrypted-store tests, which are skipped without it.
    "cryptography>=42",
    # Small, pure Python, and the phone tests measure it against the rules.
    # spaCy is deliberately *not* here: it pulls a compiled stack and a model
    # download, and the recogniser tests use a fake so they run everywhere.
    "phonenumbers>=8.13",
]

# The encrypted mapping store, and nothing else. Optional because the default
# store writes nothing to disk and needs no cipher, so the promise of zero
# runtime dependencies is unchanged for anybody who does not ask for this.
encrypted = ["cryptography>=42"]

# Google's libphonenumber, Apache-2.0. Turns "a run of ten digits" from a shape
# into a number a real plan accepts, which raises recall and precision at once.
phone = ["phonenumbers>=8.13"]

# A named-entity recogniser for the gap SECURITY.md calls the largest here: a
# personal name with no anchor beside it. MIT, and the model is a separate
# download with its own licence -- `python -m spacy download en_core_web_sm`.
nlp = ["spacy>=3.7"]

# Presidio's analyzer, usable as a recogniser here. MIT. It brings its own
# model stack, which is both why somebody would want it and why it cannot be a
# default.
presidio = ["presidio-analyzer>=2.2"]

[project.urls]
Homepage = "https://github.com/Nananananana/mamori"
Repository = "https://github.com/Nananananana/mamori"
Issues = "https://github.com/Nananananana/mamori/issues"
Changelog = "https://github.com/Nananananana/mamori/blob/main/CHANGELOG.md"

[project.scripts]
mamori = "mamori.interfaces.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mamori"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-q` is deliberately **not** here.
#
# It was, and it is a trap rather than a preference: a caller adding `-q` --
# which everybody does -- stacks to `-qq`, and `-qq` prints no summary line at
# all. So `pytest -q ... | grep passed` returns nothing, and a suite that ran
# green looks identical to one that did not run. Measured three times in one
# session, and a sibling project found the same thing in two of its own
# scripts.
#
# Worse together with `-k`: under `-qq` a filter matching nothing prints an
# empty line, and through a pipe the exit code is lost, so "no tests ran" and
# "all tests passed" are the same bytes. The summary line is what tells them
# apart, and this is the line that was removing it.
# A parametrized test whose parameter set turns out to be empty is marked
# `skip` by default, and a skipped test reports green. Several checks in this
# suite assert that a count is zero -- no `import logging` in `src`, no
# unconditional `Requires-Dist`, `socket` in exactly two files -- and a check
# that counts to zero cannot tell a clean codebase from a population that
# vanished. Point `PACKAGE_ROOT` at a directory that does not exist and every
# one of them passes. This makes that a collection error instead.
empty_parameter_set_mark = "fail_at_collect"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "RUF"]
ignore = [
    "S101",   # assert: this is a test suite convention
    # Full-width characters are the subject matter, not a typo. Half of the
    # detection logic exists because ｔａｎａｋａ＠ｅｘａｍｐｌｅ．ｃｏｍ and
    # tanaka@example.com are the same address, so both forms appear in code,
    # docstrings and fixtures on purpose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# S310: the proxy tests drive a real server on a loopback port they opened.
"tests/*" = ["S105", "S106", "S108", "S310"]
"src/mamori/infrastructure/detectors/patterns.py" = ["S105", "E501"]

[tool.mypy]
python_version = "3.10"
# Everything, not just the package. `files = ["src/mamori"]` checked 86 of the
# repository's 130 Python files and said "Success" -- the scope of a check has
# to match the scope of what it protects, and a narrower spelling of it passes
# by construction. The tests are where the fakes live, and a fake that does not
# satisfy the protocol it stands in for is exercising a path no real
# implementation takes.
files = ["src/mamori", "tests", "scripts"]
strict = true
warn_unreachable = true

# tomllib arrived in 3.11. The import is guarded at runtime and the caller gets
# a clear message telling them to use JSON, but mypy pinned to 3.10 cannot see
# a module that does not exist there.
# Dev-only, and it ships no stubs. Named rather than blanket-ignored so that a
# second untyped import has to be argued for.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tomllib"
ignore_missing_imports = true

# The optional recognisers. `follow_imports = "skip"` stops mypy reading their
# stubs, which is not politeness: they are third-party packages this repository
# does not own.
#
# `[nlp]` is deliberately **not** a dev dependency, and this is one of the
# reasons. Installing spaCy pulls numpy, whose stubs use a 3.12 `type`
# statement; mypy is pinned to 3.10 because that is what mamori supports, and
# a syntax error in somebody else's stub aborts the whole run -- it cannot be
# suppressed, because a file that will not parse never reaches the rules that
# would ignore it. The environment this check describes is `[dev]`, and
# `pip install -e ".[dev,nlp]"` is a different one. Run the type check in the
# first; the spaCy tests skip themselves in it and measure in the second.
[[tool.mypy.overrides]]
module = [
    "presidio_analyzer",
    "presidio_analyzer.*",
    "spacy",
    "spacy.*",
    "numpy",
    "numpy.*",
    "phonenumbers",
    "phonenumbers.*",
    "thinc",
    "thinc.*",
    "srsly",
    "srsly.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["src/mamori"]
