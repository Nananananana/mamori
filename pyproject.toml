[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mamori"
version = "0.1.0"
description = "Local-first privacy layer for generative AI. Detect and pseudonymize secrets before they reach an external LLM, and restore them locally afterwards."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Nananananana" }]
keywords = ["privacy", "pii", "llm", "anonymization", "pseudonymization", "security", "japanese"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.90",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Nananananana/mamori"
Repository = "https://github.com/Nananananana/mamori"
Issues = "https://github.com/Nananananana/mamori/issues"
Changelog = "https://github.com/Nananananana/mamori/blob/main/CHANGELOG.md"

[project.scripts]
mamori = "mamori.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mamori"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "RUF"]
ignore = [
    "S101",   # assert: this is a test suite convention
    # Full-width characters are the subject matter, not a typo. Half of the
    # detection logic exists because ｔａｎａｋａ＠ｅｘａｍｐｌｅ．ｃｏｍ and
    # tanaka@example.com are the same address, so both forms appear in code,
    # docstrings and fixtures on purpose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"src/mamori/infrastructure/detectors/patterns.py" = ["S105", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/mamori"]
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["src/mamori"]
