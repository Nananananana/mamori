name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest --cov=mamori --cov-report=term-missing
        env:
          PYTHONUTF8: "1"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip pip-audit && python -m pip install -e ".[dev]"

      # mamori itself is installed editable and is not on PyPI, so it cannot be
      # audited and has to be skipped. --strict would then fail on that skip
      # rather than on a vulnerability, so it is left off: pip-audit still
      # exits non-zero whenever a dependency has a known advisory.
      - name: Audit
        run: python -m pip_audit --skip-editable

  distribution:
    name: the built package, not the source tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Every other job installs editable, which imports straight from the
      # source tree and so cannot see a packaging mistake at all. The schema
      # `mamori.protection-scope/1` ships as package data and three sibling
      # projects read it from the installed package; a build config that
      # stopped including it would break all of them and no test here would
      # notice. So: build it, install the wheel, and use it from somewhere
      # else on disk.
      - name: Build
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Check the metadata PyPI would check
        run: python -m twine check dist/*

      - name: Install the wheel, not the checkout
        run: python -m pip install dist/*.whl

      - name: Use it from outside the source tree
        working-directory: /tmp
        env:
          PYTHONUTF8: "1"
        run: |
          python - <<'PY'
          import json
          import mamori
          from mamori.provenance import CONTRACT, SCHEMA, protection_record

          assert SCHEMA["title"] == CONTRACT, "the schema did not ship as package data"

          session = mamori.PrivacySession(locales=["ja", "en"])
          result = session.protect("Contact Jane Doe at jane.doe@example.com")
          record = protection_record(result, session=session)
          json.dumps(record)  # A record that will not serialise is not a record.

          assert record["contract"] == CONTRACT
          assert record["placeholders"], "nothing was protected; the rules did not ship"
          assert b"Jane Doe" not in json.dumps(record).encode()
          print("ok:", mamori.__version__, record["mode"])
          PY

      # Everything above is about the artefact, and all of it passes on a name
      # that belongs to somebody else. The only thing that fails then is the
      # upload -- which happens after a GitHub Release has been created, and a
      # Release is public the moment it is made. No check inside `publish.yml`
      # can help: by the time it runs, the irreversible part is done.
      #
      # So the question "can this be published at all" is answered here, on
      # every push, where the answer is still free.
      # `py.typed` is a promise to whoever installs this: their type checker
      # will read mamori's annotations instead of treating the package as
      # untyped. The file being in the repository is the reason it goes in --
      # it is not a reason it keeps going in, and a packaging change would drop
      # it in silence, because nothing here fails when a downstream loses types.
      #
      # So the check is the promise itself rather than the file: a program that
      # imports mamori is type checked against the *installed* package, and has
      # to come out knowing that `protected_text` is a `str`.
      - name: A downstream still gets types
        working-directory: /tmp
        run: |
          python -m pip install mypy
          cat > downstream.py <<'PY'
          import mamori

          session = mamori.PrivacySession(locales=["ja"])
          result = session.protect("x")
          reveal_type(result.protected_text)
          PY
          python -m mypy downstream.py | tee out.txt
          grep -q 'Revealed type is "str"' out.txt

      # Two halves of one question -- can this be published -- and both have
      # to be answered before a GitHub Release exists, because a Release is
      # public the moment it is made.
      #
      #   the name        somebody else's state: is it taken
      #   direct refs     our own state: does the metadata name a URL
      #
      # A single PEP 508 direct reference makes warehouse reject the **whole**
      # distribution, not the extra carrying it. Nothing else here catches it:
      # hatchling refuses to build and names the flag that silences itself,
      # `twine check` says PASSED, and the zero-dependency assertion passes
      # because it filters `extra ==`. Measured on a poisoned build of this
      # tree, not assumed.
      - name: The name can still be claimed
        run: python scripts/check_name_is_claimable.py

      - name: The metadata names no URL
        run: python scripts/check_no_direct_references.py dist/*

      - name: Keep the zero-dependency promise honest
        run: |
          python - <<'PY'
          from importlib.metadata import metadata

          declared = metadata("mamori").get_all("Requires-Dist") or []

          # A check that counts to zero cannot tell a clean package from a
          # population that vanished. If a packaging change dropped every
          # `Requires-Dist` line -- extras included -- the assertion below
          # would pass, print 0, and hide that `mamori[encrypted]` now
          # installs no cipher. So the extras have to still be there.
          assert declared, (
              "no Requires-Dist at all. That is not zero runtime dependencies, "
              "it is metadata that lost the extras: `pip install mamori[encrypted]` "
              "would silently install nothing."
          )
          for extra in ("cryptography", "pytest"):
              assert any(extra in value for value in declared), (
                  f"{extra} is no longer declared by any extra: {declared}"
              )

          required = [value for value in declared if "extra ==" not in value]
          assert not required, f"mamori grew a runtime dependency: {required}"
          print(f"runtime dependencies: 0, of {len(declared)} declared for extras")
          PY

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Mypy
        run: python -m mypy
