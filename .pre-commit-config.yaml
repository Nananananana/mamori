# Keep this fast. A hook that makes committing slow gets bypassed, and a
# bypassed hook protects nothing. Type checking and tests run in CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      # `types_or` on both, because the hooks default to Python files and CI
      # runs `ruff check .` / `ruff format --check .`, which also read the
      # Python inside markdown fences. Two mechanisms in this repository
      # disagreeing about what "the checks" cover is how three READMEs drifted
      # and main went red with nobody noticing: the narrower one runs first and
      # says nothing, so the wider one looks like it changed its mind.
      - id: ruff
        args: [--fix]
        types_or: [python, pyi, jupyter, markdown]
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      # A mapping file holds every value the library just removed from a
      # prompt. It must never reach a commit.
      - id: check-added-large-files
      - id: detect-private-key
